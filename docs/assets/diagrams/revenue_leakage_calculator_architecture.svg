      <g transform="translate(496, 0)">
        <rect x="0" y="0" width="226" height="75" rx="8" fill="#0F172A" stroke="#2A3B5C"/>
        <text x="16" y="26" font-size="12" font-weight="700" fill="#F8FAFC">Lead Capture Form</text>
        <text x="16" y="42" font-size="10.5" font-weight="400" fill="#94A3B8">User contact &amp; business info</text>
        <text x="16" y="58" class="font-mono" font-size="8.5" font-weight="600" fill="#38BDF8">Validated JSON payload</text>
      </g>
    </g>
