  <!-- SVG FOOTER STAMP -->
  <text x="425" y="1098" class="font-mono" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">M. Haresh Kumar Portfolio • Interactive Revenue Leakage Calculator</text>
</svg>
