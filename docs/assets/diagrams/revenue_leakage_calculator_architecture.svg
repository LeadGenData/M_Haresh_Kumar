    <rect x="0" y="0" width="6" height="150" rx="3" fill="#E34F26"/>

    <rect x="24" y="18" width="130" height="22" rx="11" fill="#E34F26" fill-opacity="0.2" stroke="#E34F26" stroke-opacity="0.5"/>
    <text x="89" y="33" class="font-mono" font-size="10" font-weight="700" fill="#FF8A65" text-anchor="middle" letter-spacing="1">WEB FRONTEND</text>

    <text x="170" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Responsive User Interface &amp; Input Diagnostic</text>
    <text x="170" y="53" font-size="12" font-weight="400" fill="#CBD5E1">Captures monthly lead volume, average deal value ($), and response lag parameters</text>

    <g transform="translate(24, 65)">
      <g transform="translate(0, 0)">
