    <text x="165" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Google Sheets Real-Time Lead CRM</text>
    <text x="165" y="53" font-size="12" font-weight="400" fill="#CBD5E1">Appends new business row with calculated potential leakage and sales follow-up status</text>

    <g transform="translate(130, 68)">
      <g transform="translate(0, 0)">
