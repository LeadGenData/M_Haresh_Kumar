    <text x="160" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Google Apps Script Webhook Endpoint</text>
    <text x="160" y="53" font-size="12" font-weight="400" fill="#CBD5E1">Receives POST JSON payload, parses lead parameters &amp; authenticates request</text>

    <g transform="translate(24, 65)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="225" height="65" rx="8" fill="#0B1220" stroke="#4285F4" stroke-opacity="0.4"/>
        <use href="#icon-appsscript" x="12" y="14"/>
        <text x="56" y="26" font-size="12" font-weight="700" fill="#F8FAFC">doPost(e) Handler</text>
        <text x="56" y="44" class="font-mono" font-size="9.5" font-weight="600" fill="#94A3B8">Google Apps Script API</text>
      </g>

      <g transform="translate(248, 0)">
        <rect x="0" y="0" width="225" height="65" rx="8" fill="#0B1220" stroke="#2A3B5C"/>
        <text x="16" y="26" font-size="12" font-weight="700" fill="#F8FAFC">CORS &amp; Auth Header</text>
        <text x="16" y="44" font-size="10.5" font-weight="400" fill="#94A3B8">Secure HTTP response handling</text>
      </g>

      <g transform="translate(496, 0)">
        <rect x="0" y="0" width="226" height="65" rx="8" fill="#0B1220" stroke="#2A3B5C"/>
        <text x="16" y="26" font-size="12" font-weight="700" fill="#F8FAFC">Payload Structuring</text>
        <text x="16" y="44" font-size="10.5" font-weight="400" fill="#94A3B8">Calculated values &amp; metadata</text>
      </g>
    </g>
  </g>

