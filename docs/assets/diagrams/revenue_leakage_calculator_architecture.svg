        <text x="16" y="42" font-size="10.5" font-weight="400" fill="#94A3B8">(Leads * Lag Drop %) * Deal</text>
        <text x="16" y="58" class="font-mono" font-size="8.5" font-weight="600" fill="#34D399">Real-time DOM update</text>
