      <g transform="translate(248, 0)">
        <rect x="0" y="0" width="225" height="108" rx="10" fill="#0B1220" fill-opacity="0.75" stroke="#10A37F" stroke-opacity="0.3"/>
        <text x="16" y="32" font-size="22" font-weight="800" fill="#38BDF8" letter-spacing="-0.5">100% Automated</text>
        <text x="16" y="50" font-size="11.5" font-weight="700" fill="#F8FAFC">Web-to-Sheet CRM</text>
        <text x="16" y="68" font-size="10" font-weight="500" fill="#94A3B8">Apps Script POST API logs</text>
        <text x="16" y="84" font-size="10" font-weight="500" fill="#94A3B8">lead info &amp; leakage metrics</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(496, 0)">
        <rect x="0" y="0" width="226" height="108" rx="10" fill="#0B1220" fill-opacity="0.75" stroke="#10A37F" stroke-opacity="0.3"/>
        <text x="16" y="32" font-size="22" font-weight="800" fill="#F59E0B" letter-spacing="-0.5">High Intent</text>
        <text x="16" y="50" font-size="11.5" font-weight="700" fill="#F8FAFC">Quantified Value</text>
        <text x="16" y="68" font-size="10" font-weight="500" fill="#94A3B8">Provides clear financial estimate</text>
        <text x="16" y="84" font-size="10" font-weight="500" fill="#94A3B8">of annual $ revenue leakage</text>
