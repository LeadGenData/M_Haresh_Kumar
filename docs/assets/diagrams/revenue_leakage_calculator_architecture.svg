    <text x="200" y="34" font-size="16" font-weight="700" fill="#F8FAFC">JavaScript Revenue Leakage Calculation</text>
    <text x="200" y="53" font-size="12" font-weight="400" fill="#CBD5E1">Calculates monthly &amp; annual lost revenue without full page reloads</text>

    <g transform="translate(24, 68)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="225" height="75" rx="8" fill="#0F172A" stroke="#F7DF1E"/>
        <use href="#icon-js" x="12" y="18"/>
